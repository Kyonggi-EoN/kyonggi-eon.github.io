{%- comment -%} 연락처 카드. 데이터: content/_data/social.yml {%- endcomment -%}
{%- assign s = include.section -%}
<section class="section">
  <div class="container">
    {%- include section-head.html section=s title="연락처" %}
    <ul class="grid grid--3 contact-list">
      {%- for c in site.data.social %}
      <li>
        <a class="card card--contact" href="{{ c.url }}">
          <span class="card__icon">{% include icon.html name=c.icon %}</span>
          <span>
            <strong>{{ c.label }}</strong>
            <span class="card__text">{{ c.value }}</span>
          </span>
        </a>
      </li>
      {%- endfor %}
    </ul>
  </div>
</section>
