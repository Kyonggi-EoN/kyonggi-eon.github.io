<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand__logo" src="{{ '/assets/images/logo.svg' | relative_url }}" alt="" width="34" height="34">
      <span class="brand__name">{{ site.title }}</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="주 메뉴">
      <ul>
        {%- for item in site.data.navigation %}
          {%- assign len = item.url | size -%}
          {%- assign prefix = page.url | slice: 0, len -%}
          <li><a href="{% include link-url.html url=item.url %}"{% if prefix == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>

    <div class="site-header__actions">
      <a class="icon-btn" href="https://github.com/{{ site.org.github }}" aria-label="GitHub">{% include icon.html name="github" %}</a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="밝은/어두운 화면 전환">
        {%- include icon.html name="sun" -%}{%- include icon.html name="moon" -%}
      </button>
      <button class="icon-btn nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="메뉴">
        {%- include icon.html name="menu" -%}
      </button>
    </div>
  </div>
</header>
