# ──────────────────────────────────────────────────────────────
# 사이트 설정
# 자주 바꾸지 않는 값만 둡니다. 메뉴·카드·연혁·글 같은 콘텐츠는
# 전부 content/ 아래에 있으니 그쪽을 고치세요. (README.md 참고)
# 이 파일을 고친 뒤에는 로컬 서버(jekyll serve)를 다시 켜야 반영됩니다.
# ──────────────────────────────────────────────────────────────

title: EoN
tagline: 꿈을 찾다, 아이디어를 현실로 만들다
description: 경기대학교 전자공학과 학술 동아리 EoN. 전공 H/W 지식과 S/W 지식을 융합해 새로운 가치를 탐구합니다.
url: https://kyonggi-eon.github.io
baseurl: ""
lang: ko
timezone: Asia/Seoul

org:
  full_name: Electronic Over Network
  university: 경기대학교 전자공학과
  github: Kyonggi-EoN
  since: 2005

# 검색엔진·SNS 미리보기 (jekyll-seo-tag)
logo: /assets/images/logo.png
image: /assets/images/og.png

# ── 폴더 구조 ─────────────────────────────────────────────────
# 콘텐츠(글·데이터·이미지)는 모두 content/ 아래에 둡니다.
collections_dir: content
data_dir: content/_data

collections:
  projects:
    output: true
    permalink: /projects/:name/
  news:
    output: true
    permalink: /news/:year/:slug/

# 블로그 글(content/_posts) 주소
permalink: /blog/:year/:slug/

# 종류별 기본 레이아웃 — 글 파일마다 layout을 적지 않아도 됩니다.
# (주의) collections_dir을 쓰면 Jekyll이 scope.path 앞의 "content/"를 잘라 버려서
# path: "content/pages" 같은 경로 지정이 듣지 않습니다. 그래서 type으로 지정합니다.
# 레이아웃 없이 내보낼 파일(JSON 등)은 머리말에 layout: null을 적으세요. (api/site.json 참고)
defaults:
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: posts }
    values: { layout: post, kind: post }
  - scope: { path: "", type: news }
    values: { layout: post, kind: news }
  - scope: { path: "", type: projects }
    values: { layout: project }

# ── 빌드 ──────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - README.md
